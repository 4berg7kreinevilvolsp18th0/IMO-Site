name: Code Quality Check

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  lint:
    name: ESLint & TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/nextjs/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/nextjs
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend/nextjs
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        working-directory: ./frontend/nextjs
        run: npm run type-check
        continue-on-error: true

      - name: Check for console.log
        working-directory: ./frontend/nextjs
        run: |
          echo "Проверка на console.log в продакшн коде..."
          if grep -r "console\.log" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" app/ components/ lib/ 2>/dev/null | grep -v "// eslint-disable" | grep -v "console.log(" | head -20; then
            echo "Найдены console.log. Рекомендуется использовать console.error или удалить в продакшн коде."
          else
            echo "console.log не найдены или закомментированы"
          fi
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/nextjs/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/nextjs
        run: npm ci

      - name: NPM security audit
        working-directory: ./frontend/nextjs
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for security issues in code
        working-directory: ./frontend/nextjs
        run: |
          echo "Проверка кода на проблемы безопасности..."
          
          # Проверка на hardcoded секреты
          echo "Проверка на hardcoded секреты..."
          if grep -rE "(password|secret|key|token|api_key|apikey)\s*=\s*['\"][^'\"]+['\"]" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" app/ components/ lib/ 2>/dev/null | grep -v "process.env" | grep -v "//" | head -10; then
            echo "Возможные hardcoded секреты найдены. Проверьте код выше."
          else
            echo "Hardcoded секреты не найдены"
          fi
          
          # Проверка на использование eval
          echo "Проверка на использование eval..."
          if grep -r "eval(" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" app/ components/ lib/ 2>/dev/null; then
            echo "Найдено использование eval() - это небезопасно!"
            exit 1
          else
            echo "eval() не используется"
          fi
        continue-on-error: true
